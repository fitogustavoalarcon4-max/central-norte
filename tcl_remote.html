<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Remoto TCL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            color: #fff;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 25px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 2px solid #00d4ff;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: #00d4ff;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 12px;
            color: #888;
        }

        .status {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
        }

        .status.connected {
            color: #00ff88;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .status.disconnected {
            color: #ff4444;
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 11px;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .button-grid.row {
            grid-template-columns: repeat(5, 1fr);
        }

        .btn {
            background: linear-gradient(135deg, #0084ff 0%, #0056b3 100%);
            border: none;
            color: white;
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 132, 255, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .btn-power {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
            grid-column: span 3;
            font-size: 16px;
        }

        .btn-power:active {
            box-shadow: 0 2px 8px rgba(255, 68, 68, 0.5);
        }

        .btn-nav {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
            font-size: 18px;
            padding: 10px;
        }

        .btn-nav:active {
            box-shadow: 0 2px 8px rgba(0, 212, 255, 0.5);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .nav-grid .btn-nav:nth-child(1) { grid-column: 2; }
        .nav-grid .btn-nav:nth-child(4) { grid-column: 1; }
        .nav-grid .btn-nav:nth-child(5) { grid-column: 2; }
        .nav-grid .btn-nav:nth-child(6) { grid-column: 3; }

        .btn-ok {
            grid-column: 2;
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            color: #000;
            font-weight: 700;
        }

        .btn-ok:active {
            box-shadow: 0 2px 8px rgba(0, 255, 136, 0.5);
        }

        .input-section {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-section input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00d4ff;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
        }

        .input-section input::placeholder {
            color: #666;
        }

        .input-section button {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .input-section button:active {
            transform: scale(0.95);
        }

        .btn-small {
            font-size: 12px;
            padding: 8px 6px;
        }

        .layout-row {
            display: flex;
            gap: 8px;
        }

        .layout-row .button-grid {
            margin: 0;
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .btn {
                font-size: 12px;
                padding: 10px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📺 TCL Remote</h1>
            <p>Control para tu TCL 65C6K</p>
            <div class="status" id="status">Conectando...</div>
        </div>

        <!-- Power -->
        <div class="section">
            <button class="btn btn-power" onclick="sendCommand('POWER')">⏻ ENCENDER/APAGAR</button>
        </div>

        <!-- Volumen y Canales -->
        <div class="section">
            <div class="section-title">Volumen y Canales</div>
            <div class="button-grid">
                <button class="btn" onclick="sendCommand('VOLUME_UP')">🔊 VOL+</button>
                <button class="btn" onclick="sendCommand('CHANNEL_UP')">CH+</button>
                <button class="btn" onclick="sendCommand('APP')">📱 App</button>
                <button class="btn" onclick="sendCommand('VOLUME_DOWN')">🔉 VOL-</button>
                <button class="btn" onclick="sendCommand('CHANNEL_DOWN')">CH-</button>
                <button class="btn" onclick="sendCommand('MUTE')">🔇 Mute</button>
            </div>
        </div>

        <!-- Navegación -->
        <div class="section">
            <div class="section-title">Navegación</div>
            <div class="nav-grid">
                <button class="btn btn-nav" onclick="sendCommand('UP')">⬆</button>
                <button class="btn btn-nav" onclick="sendCommand('LEFT')">⬅</button>
                <button class="btn btn-nav" onclick="sendCommand('DOWN')">⬇</button>
                <button class="btn btn-nav" onclick="sendCommand('RIGHT')">➡</button>
                <button class="btn btn-ok" onclick="sendCommand('ENTER')">OK</button>
            </div>
        </div>

        <!-- Multimedia -->
        <div class="section">
            <div class="section-title">Multimedia</div>
            <div class="button-grid row">
                <button class="btn btn-small" onclick="sendCommand('REWIND')">⏮</button>
                <button class="btn btn-small" onclick="sendCommand('PLAY_PAUSE')">⏯</button>
                <button class="btn btn-small" onclick="sendCommand('FORWARD')">⏭</button>
                <button class="btn btn-small" onclick="sendCommand('BACK')">⏹</button>
                <button class="btn btn-small" onclick="sendCommand('HOME')">🏠</button>
            </div>
        </div>

        <!-- Acceso Rápido Apps -->
        <div class="section">
            <div class="section-title">Apps Rápidas</div>
            <div class="button-grid">
                <button class="btn btn-small" onclick="launchApp('netflix')">Netflix</button>
                <button class="btn btn-small" onclick="launchApp('youtube')">YouTube</button>
                <button class="btn btn-small" onclick="launchApp('disneyplus')">Disney+</button>
            </div>
        </div>

        <!-- Entrada Manual de Comando -->
        <div class="section">
            <div class="section-title">Comando Personalizado</div>
            <div class="input-section">
                <input type="text" id="customCmd" placeholder="KEY_CODE">
                <button onclick="sendCustom()">Enviar</button>
            </div>
        </div>

        <!-- IP y Estado -->
        <div class="section" style="border-top: 1px solid rgba(0, 212, 255, 0.3); padding-top: 15px; margin-top: 15px;">
            <div class="input-section" style="margin-bottom: 8px;">
                <input type="text" id="tvIP" placeholder="192.168.1.82" value="192.168.1.82">
                <button onclick="updateIP()">Conectar</button>
            </div>
            <div style="font-size: 11px; color: #888; text-align: center;">
                <div id="ipStatus">IP configurada: 192.168.1.82</div>
            </div>
        </div>
    </div>

    <script>
        let tvIP = localStorage.getItem('tvIP') || '192.168.1.82';
        let isConnected = false;

        // Actualizar IP
        function updateIP() {
            const newIP = document.getElementById('tvIP').value.trim();
            if (newIP) {
                tvIP = newIP;
                localStorage.setItem('tvIP', tvIP);
                document.getElementById('ipStatus').textContent = 'IP configurada: ' + tvIP;
                testConnection();
            }
        }

        // Probar conexión
        function testConnection() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Probando conexión...';
            statusEl.className = 'status';

            // Intentar conexión simple
            fetch(`http://${tvIP}:6095/`)
                .then(() => {
                    isConnected = true;
                    statusEl.textContent = '✓ Conectado';
                    statusEl.className = 'status connected';
                })
                .catch(() => {
                    isConnected = false;
                    statusEl.textContent = '✗ Desconectado';
                    statusEl.className = 'status disconnected';
                });
        }

        // Enviar comando
        async function sendCommand(cmd) {
            const commands = {
                'POWER': 'POWER',
                'VOLUME_UP': 'VOLUME_UP',
                'VOLUME_DOWN': 'VOLUME_DOWN',
                'MUTE': 'MUTE',
                'CHANNEL_UP': 'CHANNEL_UP',
                'CHANNEL_DOWN': 'CHANNEL_DOWN',
                'UP': 'UP',
                'DOWN': 'DOWN',
                'LEFT': 'LEFT',
                'RIGHT': 'RIGHT',
                'ENTER': 'ENTER',
                'PLAY_PAUSE': 'PLAY_PAUSE',
                'REWIND': 'REWIND',
                'FORWARD': 'FORWARD',
                'BACK': 'BACK',
                'HOME': 'HOME',
                'APP': 'APP'
            };

            const keyCode = commands[cmd];
            if (!keyCode) return;

            try {
                // Método 1: POST a puerto 6095 (Google TV)
                await fetch(`http://${tvIP}:6095/remote`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        keyCode: keyCode
                    })
                }).catch(() => {
                    // Método 2: Intent URI (fallback)
                    console.log('Intentando método alternativo...');
                });
            } catch (e) {
                console.log('Error:', e);
            }
        }

        // Lanzar apps
        function launchApp(app) {
            const apps = {
                'netflix': 'com.netflix.mediaclient',
                'youtube': 'com.google.android.youtube.tv',
                'disneyplus': 'com.disney.disneyplus'
            };

            const packageName = apps[app];
            if (packageName) {
                sendCommand('HOME');
                setTimeout(() => {
                    fetch(`http://${tvIP}:6095/launch`, {
                        method: 'POST',
                        body: JSON.stringify({ package: packageName })
                    }).catch(() => {});
                }, 500);
            }
        }

        // Comando personalizado
        function sendCustom() {
            const cmd = document.getElementById('customCmd').value.trim();
            if (cmd) {
                fetch(`http://${tvIP}:6095/remote`, {
                    method: 'POST',
                    body: JSON.stringify({ keyCode: cmd })
                }).catch(() => {});
                document.getElementById('customCmd').value = '';
            }
        }

        // Inicializar
        window.addEventListener('load', () => {
            document.getElementById('tvIP').value = tvIP;
            testConnection();
        });

        // Reconectar cada 30 segundos
        setInterval(testConnection, 30000);
    </script>
</body>
</html>
